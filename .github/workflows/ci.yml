# What there is to check without a build step or a test runner.
#
# The simulator has no dependencies and no bundler, so CI's job is to catch the
# things that would otherwise only show up as a blank page in a browser: a
# syntax error in a module, an import that points at a file that is not there,
# and a data file that does not parse.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # find rather than a ** glob: globstar is a bash 4 option, and a shell
      # without it silently checks a subset instead of failing
      - name: parse every module
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "all $(find src -name '*.js' | wc -l | tr -d ' ') modules parse"

      - name: every local import resolves
        run: node .github/scripts/check-imports.mjs

      - name: data files parse
        run: |
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              && echo "ok  $f ($(du -h "$f" | cut -f1))" || exit 1
          done

      - name: the page references files that exist
        run: node .github/scripts/check-page.mjs

  # The checks above cannot see a module that parses, imports cleanly and then
  # throws the moment it is evaluated. This one loads the page for real.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install a browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: serve the repository
        run: |
          node .github/scripts/serve.mjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8777/index.html >/dev/null && break
            sleep 1
          done

      - name: load the page and fail on anything it throws
        run: node .github/scripts/smoke.mjs
